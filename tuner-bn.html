<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instrument Tuner | Fretboard Mastery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #cccccc;
            --bg-card: #ffffff;
            --text-main: #212529;
            --text-muted: #585c5f;
            --primary: #212529;
            --primary-hover: #000000;
            --border: #e9ecef;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            
            --tune-success: #28a745;
            --tune-flat: #ffc107;
            --tune-sharp: #dc3545;
            --meter-bg: #e9ecef;
            
            --container-max: 1100px;
            --header-height: 80px;
            --radius-md: 12px;
            --radius-pill: 50px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f8f9fa;
            --text-muted: #8a8a8a;
            --primary: #f8f9fa;
            --primary-hover: #ffffff;
            --border: #343a40;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --meter-bg: #343a40;
            }
            .btn-outline {
                border-color: #495057;
                color: var(--text-main);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html.notranslate, body.notranslate { translate: no; }
        body { top: 0 !important; }
        html { margin-top: 0 !important; }
        .goog-te-banner-frame,
        .goog-te-menu-frame,
        .goog-te-gadget,
        #google_translate_element {
            display: none !important;
            visibility: hidden !important;
        }

        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; transition: opacity 0.2s; }
        ul { list-style: none; }
        button { font-family: inherit; border: none; cursor: pointer; }

        .container {
            width: 100%;
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0 20px;
        }

        .flex-center { display: flex; align-items: center; justify-content: center; }
        .text-center { text-align: center; }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            height: var(--header-height);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header {
            transition: transform 0.35s ease-in-out;
        }

        header.hide {
            transform: translateY(-100%);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .brand {
            font-weight: 700;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .brand img {
            height: 20px;
            width: 15px;
        }

        .nav-links { display: flex; gap: 30px; }
        .nav-links a { font-weight: 500; color: var(--text-main); position: relative; }
        .nav-links a:hover { color: var(--text-main); font-weight: 700; }

        .mobile-toggle { 
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
        }

        @media (max-width: 768px) {
        .nav-links {
            display: none;
            position: absolute;
            top: 80px;
            left: 0;
            right: 0;
            background-color: var(--bg-card);
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            transform: translateY(-110%);
            transition: transform 0.35s ease-in-out, opacity 0.2s ease;
            opacity: 0;
            pointer-events: none;
            display: flex;
            z-index: 99;
        }

       .nav-links.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

       .mobile-toggle {
            display: block;}
        }

        .mobile-toggle i {
          transition: transform 0.35s ease, opacity 0.2s ease;
        }

        .mobile-toggle.active i {
          transform: rotate(90deg);
        }

        .mobile-toggle i {
          transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        main { 
            flex: 1;
            padding: 60px 0;
        }

        .hero-text { 
            margin-bottom: 40px; 
        }
        .hero-text h1 { 
            font-size: 2.5rem; 
            font-weight: 700; 
            margin-bottom: 10px; 
            letter-spacing: -1px; 
        }

        .hero-text p { 
          color: var(--text-muted); 
          font-size: 1.1rem; 
        }

        .tuner-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .instrument-switch {
            background-color: var(--bg-body);
            border-radius: var(--radius-pill);
            padding: 5px;
            display: inline-flex;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        .switch-option {
            padding: 10px 25px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
            user-select: none;
        }

        .switch-option:hover { color:black; }
        
        .switch-option.active {
            background-color: var(--bg-card);
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        @media (prefers-color-scheme: dark) {
            .switch-option.active { 
            background-color: #343a40; 
            color: white; }
        }

        .meter-container {
            position: relative;
            width: 100%;
            max-width: 280px;
            aspect-ratio: 2 / 1;
            margin: 0 auto 24px;
            overflow: visible;
        }

        .meter-arc {
            position: absolute;
            width: 100%;
            height: 200%;
            left: 50%;
            top: 0;
            transform: translateX(-50%) rotate(45deg);
            border-radius: 50%;
            border: 14px solid var(--meter-bg);
            border-bottom-color: transparent;
            border-right-color: transparent;
            box-sizing: border-box;
        }

        .needle {
            height: 85%;
        }

        .needle-pivot {
            bottom: -10px;
        }

        @media (max-width: 420px) {
        .tuner-card {
            padding: 24px 16px;
          }
        }

        .meter-center-mark {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 20px;
            background-color: var(--tune-success);
            z-index: 2;
            border-radius: 2px;
        }

        .needle {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 4px;
            height: 85%;
            background-color: var(--text-main);
            transform-origin: bottom center;
            transform: rotate(0deg);
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1), background-color 0.2s;
            z-index: 5;
            border-radius: 4px 4px 0 0;
        }

        .needle-pivot {
            width: 20px;
            height: 20px;
            background-color: var(--text-main);
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
        }

        .note-display {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }

        .freq-display {
            font-family: 'Inter', monospace;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .status-text {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            height: 20px;
            margin-bottom: 25px;
        }

        .controls { margin-top: 20px; }

        .btn-start {
            background-color: var(--primary);
            color: var(--bg-card);
            padding: 14px 40px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .btn-start.active {
            background-color: var(--tune-sharp);
            color: white;
        }

        .reference-notes {
            margin-top: 30px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .string-list {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .string-badge {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        
        .string-badge.target {
            background-color: var(--primary);
            color: var(--bg-card);
            border-color: var(--primary);
        }

        .in-tune .needle { background-color: var(--tune-success); }
        .in-tune .note-display { color: var(--tune-success); }
        .in-tune .status-text { color: var(--tune-success); }
        .in-tune .needle-pivot { background-color: var(--tune-success); }

        .flat .needle { background-color: var(--tune-flat); }
        .flat .note-display { color: var(--tune-flat); }
        
        .sharp .needle { background-color: var(--tune-sharp); }
        .sharp .note-display { color: var(--tune-sharp); }

        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 40px 0;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

       
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
        <div class="brand">
        <img id="logoImg" src="logo.png" alt="Fretboard Mastery Logo">
        <span class="brand-name">Fretboard Mastery</span>
        </div> 
            <nav>
                <ul class="nav-links" id="navLinks">

</ul>
            </nav>
            <div class="mobile-toggle" id="mobile-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <main>
        <div class="container text-center">
            
            <div class="hero-text">
                <h1>Instrument Tuner</h1>
                <p>আপনার microphone ব্যবহার করে real time-এ instrument সঠিকভাবে Tune করুন।</p>
            </div>

            <div class="tuner-card">
                
                <div class="instrument-switch" role="radiogroup" aria-label="Instrument নির্বাচন করুন">
                   <button class="switch-option active" data-inst="guitar">
                        <i class="fas fa-guitar"></i> Guitar
                    </button>
                    <button class="switch-option active" data-inst="ukulele">
                        <i class="fas fa-music"></i> Ukulele
                    </button>
                    <button class="switch-option active" data-inst="bass">
                        <i class="fas fa-bolt"></i> Bass
                    </button>
                </div>

                <div class="meter-container">
                    <div class="meter-arc"></div>
                    <div class="meter-center-mark"></div>
                    <div class="needle" id="tunerNeedle"></div>
                    <div class="needle-pivot"></div>
                </div>

                <div id="noteDisplay" class="note-display">--</div>
                <div id="freqDisplay" class="freq-display">0 Hz</div>
                <div id="statusText" class="status-text">Tune করতে Start চাপুন</div>

                <div class="controls">
                    <button id="startBtn" class="btn-start">
                        <i class="fas fa-microphone"></i> Tuner চালু করুন
                    </button>
                </div>

                <div class="reference-notes">
                    <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 10px;">Standard Tuning</p>
                    <div class="string-list" id="stringList">
                        </div>
                </div>
                
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Fretboard Mastery. সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>
<script>
const NOTE_STRINGS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const A4 = 440;
let audioContext, analyser, buffer, rafId;
let isRunning = false;

let freqHistory = [];
const HISTORY_SIZE = 5;
const startBtn = document.getElementById("startBtn");
const noteEl = document.getElementById("noteDisplay");
const freqEl = document.getElementById("freqDisplay");
const statusEl = document.getElementById("statusText");
const needle = document.getElementById("tunerNeedle");
const tunerCard = document.querySelector(".tuner-card");

let currentInstrument = null;

const INSTRUMENTS = {
  guitar: ["E", "A", "D", "G", "B", "E"],
  ukulele: ["G", "C", "E", "A"],
  bass: ["E", "A", "D", "G"]
};

const STRING_FREQUENCIES = {
  guitar: {
    E: 82.41,
    A: 110.00,
    D: 146.83,
    G: 196.00,
    B: 246.94,
    E2: 329.63
  },
  ukulele: {
    G: 392.00,
    C: 261.63,
    E: 329.63,
    A: 440.00
  },
  bass: {
    E: 41.20,
    A: 55.00,
    D: 73.42,
    G: 98.00
  }
};

const switchButtons = document.querySelectorAll(".switch-option");
const stringList = document.getElementById("stringList");

switchButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    switchButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    currentInstrument = btn.dataset.inst;
statusEl.textContent = "Tune করতে Start চাপুন";
statusEl.style.color = "";
renderStrings();

  });
});

function renderStrings() {
  stringList.innerHTML = "";
  INSTRUMENTS[currentInstrument].forEach(s => {
    const el = document.createElement("div");
    el.className = "string-badge";
    el.textContent = s;
    stringList.appendChild(el);
  });
}

startBtn.addEventListener("click", async () => {
  if (!currentInstrument) {
    showModeWarning();
    return;
  }
  isRunning ? stop() : await start();
});


async function start() {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === "suspended") await audioContext.resume();

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false }
  });

  analyser = audioContext.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0;

  buffer = new Float32Array(analyser.fftSize);

  audioContext.createMediaStreamSource(stream).connect(analyser);

  isRunning = true;
  startBtn.innerHTML = '<i class="fas fa-stop"></i> Tuner বন্ধ করুন';
  startBtn.classList.add("active");

  update();
}

function stop() {
  isRunning = false;
  cancelAnimationFrame(rafId);
  audioContext.close();
  freqHistory = [];

  noteEl.textContent = "--";
  freqEl.textContent = "0 Hz";
  statusEl.textContent = "Tune করতে Start চাপুন";
  needle.style.transform = "rotate(0deg)";
  tunerCard.classList.remove("in-tune","flat","sharp");

  startBtn.innerHTML = '<i class="fas fa-microphone"></i> Tuner চালু করুন';
  startBtn.classList.remove("active");
}

function update() {
  analyser.getFloatTimeDomainData(buffer);
  const freq = detectPitch(buffer, audioContext.sampleRate);

  if (freq) {
    const corrected = correctOctave(freq);
    lockFrequency(corrected);
  } else {
    statusEl.textContent = "একটি string বাজান…";
  }

  rafId = requestAnimationFrame(update);
}

function detectPitch(buf, sampleRate) {
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  if (rms < 0.005) return null;

  const MIN_OFFSET = 50;
  const MAX_OFFSET = 2200;

  let bestOffset = -1;
  let bestCorr = 0;

  for (let offset = MIN_OFFSET; offset <= MAX_OFFSET; offset++) {
    let corr = 0;
    for (let i = 0; i < buf.length - offset; i++) {
      corr += buf[i] * buf[i + offset];
    }
    if (corr > bestCorr) {
      bestCorr = corr;
      bestOffset = offset;
    }
  }

  return bestOffset > 0 ? sampleRate / bestOffset : null;
}

function correctOctave(freq) {
  const note = 12 * Math.log2(freq / A4);
  const rounded = Math.round(note);
  const ideal = A4 * Math.pow(2, rounded / 12);

  if (Math.abs(freq - ideal * 2) < Math.abs(freq - ideal)) return freq / 2;
  if (Math.abs(freq - ideal / 2) < Math.abs(freq - ideal)) return freq * 2;

  return freq;
}

function lockFrequency(freq) {
  const targets = Object.values(STRING_FREQUENCIES[currentInstrument]);

  const closest = targets.reduce((a, b) =>
    Math.abs(b - freq) < Math.abs(a - freq) ? b : a
  );

  if (Math.abs(freq - closest) > closest * 0.15) return;

  freqHistory.push(freq);
  if (freqHistory.length > HISTORY_SIZE) freqHistory.shift();

  if (freqHistory.length < HISTORY_SIZE) return;

  const sorted = [...freqHistory].sort((a, b) => a - b);
  const stableFreq = sorted[Math.floor(sorted.length / 2)];

  updateUI(stableFreq);
}

function updateUI(freq) {
  const noteNum = 12 * Math.log2(freq / A4);
  const midi = Math.round(noteNum) + 69;
  const note = NOTE_STRINGS[midi % 12];
  const cents = Math.floor((noteNum - Math.round(noteNum)) * 100);

  noteEl.textContent = note;
  freqEl.textContent = freq.toFixed(1) + " Hz";
  highlightNearestString(note);


  const angle = Math.max(-50, Math.min(50, cents)) * 1.8;
  needle.style.transform = `rotate(${angle}deg)`;

  tunerCard.classList.remove("in-tune","flat","sharp");

  if (Math.abs(cents) < 5) {
    statusEl.textContent = "সঠিক";
    tunerCard.classList.add("in-tune");
  } else if (cents < 0) {
    statusEl.textContent = "খুব Low";
    tunerCard.classList.add("flat");
  } else {
    statusEl.textContent = "খুব High";
    tunerCard.classList.add("sharp");
  }
}

function highlightNearestString(note) {
  const badges = document.querySelectorAll(".string-badge");
  badges.forEach(badge => {
    badge.classList.toggle("target", badge.textContent === note);
  });
}

function showModeWarning() {
  statusEl.textContent = "অনুগ্রহ করে একটি mode নির্বাচন করুন";
  statusEl.style.color = "#dc3545";
}

function setInstrument(inst) {
  currentInstrument = inst;
  switchOptions.forEach(btn =>
    btn.classList.toggle("active", btn.dataset.inst === inst)
  );
  renderStrings();
}

const mobileToggle = document.querySelector(".mobile-toggle");
const navLinks = document.querySelector(".nav-links");

mobileToggle?.addEventListener("click", () => {
  navLinks.classList.toggle("active");
  mobileToggle.classList.toggle("active");

  const icon = mobileToggle.querySelector("i");

  if (icon.classList.contains("fa-bars")) {
    icon.classList.remove("fa-bars");
    icon.classList.add("fa-times");
  } else {
    icon.classList.remove("fa-times");
    icon.classList.add("fa-bars");
  }
});

let lastScrollY = window.scrollY;
const header = document.querySelector("header");

window.addEventListener("scroll", () => {
  const currentY = window.scrollY;
  if (currentY > lastScrollY && currentY > 80) {
    header.classList.add("hide");
  } else {
    header.classList.remove("hide");
  }
  lastScrollY = currentY;
});
</script>
<script>
function updateLogo() {
  const logo = document.getElementById("logoImg");
  const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

  if (isDark) {
    logo.src = "logoW.png";
  } else {
    logo.src = "logo.png";
  }
}
updateLogo();
window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", updateLogo);
</script>
